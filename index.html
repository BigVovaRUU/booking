<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Care Dental – Запись на приём</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="css/style.css"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#13b6ec",
            "background-light": "#f6f8f8",
            "background-dark": "#101d22",
            "content-light": "#ffffff",
            "content-dark": "#1a2c33",
            "text-light": "#0d181b",
            "text-dark": "#e7f0f3",
            "subtle-light": "#e7f0f3",
            "subtle-dark": "#243b43",
            "border-light": "#cfe1e7",
            "border-dark": "#36505a"
          },
          fontFamily: { display: ["Inter", "sans-serif"] },
          borderRadius: { DEFAULT: "0.5rem", lg: "0.75rem", xl: "1rem", full: "9999px" },
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-content-light dark:bg-content-dark border-b border-border-light dark:border-border-dark sticky top-0 z-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <div class="flex items-center gap-3">
        <svg class="h-8 w-8 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l9 10-9 10-9-10 9-10z"/>
        </svg>
        <h1 class="text-xl font-bold">Care Dental</h1>
      </div>
      <!-- Переключатель темы -->
      <button id="theme-toggle" class="p-2 rounded-lg hover:bg-subtle-light dark:hover:bg-subtle-dark transition">
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
        </svg>
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.02 4.66l-.71-.71M6.05 6.05l-.71-.71m12.02 12.02l-.71-.71M6.05 17.95l-.71-.71M12 5a7 7 0 100 14a7 7 0 000-14z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">

    <!-- ===== Форма ===== -->
    <section id="form-section" class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 animate-[fadeIn_0.8s_ease]">
      
      <!-- Данные -->
      <div class="bg-content-light dark:bg-content-dark p-6 sm:p-8 rounded-xl shadow-md hover:shadow-xl transition">
        <h2 class="text-2xl sm:text-3xl font-bold mb-6">Запишитесь на приём</h2>
        <form id="appointment-form" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium mb-2">Имя</label>
            <input id="name" type="text" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium mb-2">Телефон</label>
            <input id="phone" type="tel" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label for="email" class="block text-sm font-medium mb-2">Email</label>
            <input id="email" type="email" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label for="reason" class="block text-sm font-medium mb-2">Услуга</label>
            <select id="reason" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary">
              <option value="Профилактический осмотр">Профилактический осмотр</option>
              <option value="Чистка зубов">Чистка зубов</option>
              <option value="Лечение кариеса">Лечение кариеса</option>
              <option value="Отбеливание зубов">Отбеливание зубов</option>
              <option value="Хирургия">Хирургия</option>
            </select>
          </div>
        </form>
      </div>

      <!-- Дата и время -->
      <div class="space-y-8">
        <div class="bg-content-light dark:bg-content-dark p-6 sm:p-8 rounded-xl shadow-md">
          <div class="flex justify-between items-center mb-4">
            <button id="prev-month" class="p-2 rounded-full hover:bg-subtle-light dark:hover:bg-subtle-dark">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <p id="month-label" class="font-semibold text-lg">Июль 2024</p>
            <button id="next-month" class="p-2 rounded-full hover:bg-subtle-light dark:hover:bg-subtle-dark">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <div id="calendar" class="calendar-grid text-center text-sm"></div>
        </div>

        <div class="bg-content-light dark:bg-content-dark p-6 sm:p-8 rounded-xl shadow-md">
          <h3 class="text-xl font-bold mb-4">Доступное время</h3>
          <div id="time-slots" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </div>

        <button id="confirm-btn" class="w-full flex items-center justify-center rounded-lg h-12 px-6 bg-primary text-white text-base font-bold hover:scale-105 transition fixed bottom-4 left-1/2 -translate-x-1/2 max-w-xs">
          Подтвердить запись
        </button>
      </div>
    </section>

    <!-- ===== Успех ===== -->
    <section id="success-section" class="hidden max-w-md mx-auto animate-[fadeIn_0.8s_ease]">
      <div class="bg-content-light dark:bg-content-dark p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 text-center">
        
        <h1 class="text-4xl font-bold text-primary mb-2">Спасибо!</h1>
        <p class="text-lg text-gray-600 dark:text-gray-400 mb-6">Мы рады будем видеть вас скоро.</p>

        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-primary/20 animate-bounce">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2l4-4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
          </svg>
        </div>

        <h2 class="mt-6 text-3xl font-bold text-gray-900 dark:text-white">Запись подтверждена!</h2>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Вы получите письмо-подтверждение на почту.</p>

        <div class="mt-8 text-left">
          <h3 class="text-lg font-medium leading-6 text-gray-900 dark:text-white">Детали записи</h3>
          <dl class="mt-4 divide-y divide-gray-200 dark:divide-gray-700">
            <div class="py-3 sm:grid sm:grid-cols-3 sm:gap-4">
              <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Дата</dt>
              <dd id="confirm-date" class="mt-1 text-sm text-gray-900 dark:text-gray-100 sm:col-span-2">—</dd>
            </div>
            <div class="py-3 sm:grid sm:grid-cols-3 sm:gap-4">
              <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Время</dt>
              <dd id="confirm-time" class="mt-1 text-sm text-gray-900 dark:text-gray-100 sm:col-span-2">—</dd>
            </div>
            <div class="py-3 sm:grid sm:grid-cols-3 sm:gap-4">
              <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Услуга</dt>
              <dd id="confirm-service" class="mt-1 text-sm text-gray-900 dark:text-gray-100 sm:col-span-2">—</dd>
            </div>
          </dl>
        </div>

        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button id="add-calendar" class="flex items-center justify-center gap-2 py-2 px-4 rounded-lg text-sm font-bold text-white bg-primary hover:bg-primary/90 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10m-7 4h4m-9 0h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14z"/>
            </svg>
            Добавить в календарь
          </button>
          <button id="back-btn" class="py-2 px-4 rounded-lg text-sm font-bold text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 transition">
            Вернуться назад
          </button>
        </div>
      </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 right-6 bg-primary text-white px-4 py-2 rounded-lg shadow-lg animate-fadeIn">
      Запись успешно создана ✅
    </div>

  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
