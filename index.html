<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Care Dental - Book Appointment</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#13b6ec",
            "background-light": "#f6f8f8",
            "background-dark": "#101d22",
            "content-light": "#ffffff",
            "content-dark": "#1a2c33",
            "text-light": "#0d181b",
            "text-dark": "#e7f0f3",
            "subtle-light": "#e7f0f3",
            "subtle-dark": "#243b43",
            "border-light": "#cfe1e7",
            "border-dark": "#36505a"
          },
          fontFamily: { display: ["Inter", "sans-serif"] },
          borderRadius: { DEFAULT: "0.5rem", lg: "0.75rem", xl: "1rem", full: "9999px" },
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-content-light dark:bg-content-dark border-b border-border-light dark:border-border-dark sticky top-0 z-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <svg class="h-8 w-8 text-primary animate-pulse" fill="none" viewBox="0 0 48 48">
            <path d="M24 4.24L43.76 24 24 43.76 4.24 24 24 4.24Z" fill="currentColor"/>
          </svg>
          <h1 class="text-xl font-bold">Care Dental</h1>
        </div>
        <button class="hidden md:flex items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold hover:scale-105 transition">
          Book Now
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
    <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 animate-[fadeIn_0.8s_ease]">
      
      <!-- Form -->
      <div class="bg-content-light dark:bg-content-dark p-6 sm:p-8 rounded-xl shadow-md hover:shadow-xl transition">
        <h2 class="text-2xl sm:text-3xl font-bold mb-6">Book Your Appointment</h2>
        <form id="appointment-form" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium mb-2">Patient Name</label>
            <input id="name" type="text" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary" placeholder="Enter your full name"/>
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium mb-2">Contact Number</label>
            <input id="phone" type="tel" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary" placeholder="Enter your phone number"/>
          </div>
          <div>
            <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
            <input id="email" type="email" class="w-full h-12 px-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary" placeholder="Enter your email"/>
          </div>
          <div>
            <label for="reason" class="block text-sm font-medium mb-2">Reason for Visit</label>
            <textarea id="reason" rows="4" class="w-full p-4 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark focus:ring-2 focus:ring-primary" placeholder="Briefly describe the reason for your visit"></textarea>
          </div>
        </form>
      </div>

      <!-- Date & Time -->
      <div class="space-y-8">
        <div class="bg-content-light dark:bg-content-dark p-6 sm:p-8 rounded-xl shadow-md">
          <h3 class="text-xl font-bold mb-4">Select a Date</h3>
          <div id="calendar" class="calendar-grid text-center text-sm"></div>
        </div>

        <div class="bg-content-light dark:bg-content-dark p-6 sm:p-8 rounded-xl shadow-md">
          <h3 class="text-xl font-bold mb-4">Available Time Slots</h3>
          <div id="time-slots" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </div>

        <button id="confirm-btn" class="w-full flex items-center justify-center rounded-lg h-12 px-6 bg-primary text-white text-base font-bold hover:scale-105 transition">
          Confirm Appointment
        </button>
      </div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
