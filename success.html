<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointment Success</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8 animate-[fadeIn_0.8s_ease]">
      <div class="bg-white dark:bg-background-dark/50 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 text-center">
        <h1 class="text-4xl font-bold text-primary mb-2">Thank You!</h1>
        <p class="text-lg text-gray-600 dark:text-gray-400 mb-6">We're excited to see you soon.</p>
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-primary/20 animate-bounce">
          <span class="material-symbols-outlined text-primary text-3xl">check</span>
        </div>
        <h2 class="mt-6 text-3xl font-bold text-gray-900 dark:text-white">Appointment Booked!</h2>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">You will receive a confirmation email shortly.</p>
        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button class="flex items-center justify-center gap-2 py-2 px-4 rounded-lg text-sm font-bold text-white bg-primary hover:bg-primary/90 transition">
            <span class="material-symbols-outlined text-xl">calendar_add_on</span> Add to Calendar
          </button>
          <a href="index.html" class="py-2 px-4 rounded-lg text-sm font-bold text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 transition">Return to Home</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
